<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link rel="stylesheet" href="style.css" />
    <title>ClickFast</title>
  </head>
  <body>
    <div id="main">
      <div id="container">
        <h1 class="flex-center">ClickFast</h1>
        <p class="catchphrase">Sois le plus rapide des clickers du game ⚡</p>

        <p class="catchphrase">Durée de la partie :</p>
        <div class="flex-center" id="duration-choice">
          <button class="duration-button" data-duration="1">1 s</button>
          <button class="duration-button" data-duration="5">5 s</button>
          <button class="duration-button" data-duration="10">10 s</button>
          <button class="duration-button" data-duration="30">30 s</button>
        </div>

        <p class="catchphrase">
          Temps restant : <span id="timer">5</span> secondes
        </p>

        <div class="flex-center">
          <div class="number" id="score">0</div>
        </div>

        <div class="flex-center">
          <button id="button-clicker">Click me!</button>
          <button id="button-reset">Reset</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
